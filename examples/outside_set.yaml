id: outside_set
version: "1"
name: Outside set
description: Mini tow — the expensive stage unlocks the approach and the cheap stage runs it; teaches unlock plus input from the previous stage.
stages:
  - role: unlock
    model_ref: tier:expensive
    artifacts: unlock/
    oracle: true
    max_attempts: 3
  - role: run
    model_ref: tier:cheap
    input: prev_stage
    oracle: true
    max_attempts: 3
on_fail: halt
