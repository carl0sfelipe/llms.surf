<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 332' width='900' height='332' role='img' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif'><title>Derivative models on Hugging Face</title><style>
.g{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}
.gu{transform-box:fill-box;transform-origin:center bottom;animation:growu 1.4s cubic-bezier(.2,.8,.2,1) both}
.f{animation:fade .8s ease both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growu{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.g,.gu,.f{animation:none}}
</style><rect width='900' height='332' rx='14' fill='#0d1117'/><text x='32' y='46' font-size='24' fill='#e6edf3' text-anchor='start' font-weight='700'>Derivative models on Hugging Face</text><text x='32' y='74' font-size='15' fill='#8b949e' text-anchor='start' font-weight='400'>Fine-tunes, merges and quants built on each base family</text><text x='286' y='118' font-size='16' fill='#e6edf3' text-anchor='end' font-weight='400'>Qwen</text><rect x='300' y='100' width='490' height='26' rx='5' fill='#30363d' opacity='.45'/><rect class='g' style='animation-delay:0.10s' x='300' y='100' width='490.0' height='26' rx='5' fill='#3FB950'/><text x='800.0' y='119' font-size='15' fill='#e6edf3' text-anchor='start' font-weight='600' class='f'>151,448</text><text x='286' y='162' font-size='16' fill='#e6edf3' text-anchor='end' font-weight='400'>Google</text><rect x='300' y='144' width='490' height='26' rx='5' fill='#30363d' opacity='.45'/><rect class='g' style='animation-delay:0.22s' x='300' y='144' width='266.9' height='26' rx='5' fill='#22D3EE'/><text x='576.9427130104062' y='163' font-size='15' fill='#e6edf3' text-anchor='start' font-weight='600' class='f'>82,506</text><text x='286' y='206' font-size='16' fill='#e6edf3' text-anchor='end' font-weight='400'>Meta (all)</text><rect x='300' y='188' width='490' height='26' rx='5' fill='#30363d' opacity='.45'/><rect class='g' style='animation-delay:0.34s' x='300' y='188' width='188.3' height='26' rx='5' fill='#22D3EE'/><text x='498.30225555966405' y='207' font-size='15' fill='#e6edf3' text-anchor='start' font-weight='600' class='f'>58,200</text><text x='286' y='250' font-size='16' fill='#e6edf3' text-anchor='end' font-weight='400'>Llama repository</text><rect x='300' y='232' width='490' height='26' rx='5' fill='#30363d' opacity='.45'/><rect class='g' style='animation-delay:0.46s' x='300' y='232' width='104.2' height='26' rx='5' fill='#22D3EE'/><text x='414.1809730072368' y='251' font-size='15' fill='#e6edf3' text-anchor='start' font-weight='600' class='f'>32,200</text><text x='32' y='310' font-size='12' fill='#8b949e' text-anchor='start' font-weight='400'>Source: Hugging Face, Summer 2026 (Meta/Llama from the reported 2.6× and 4.7× ratios)</text></svg>