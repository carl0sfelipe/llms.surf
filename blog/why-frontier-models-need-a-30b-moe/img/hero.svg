<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 630' width='1200' height='630' role='img' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif'><title>Why frontier models need a ~30B MoE sibling</title><style>
.g{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}
.gu{transform-box:fill-box;transform-origin:center bottom;animation:growu 1.4s cubic-bezier(.2,.8,.2,1) both}
.f{animation:fade .8s ease both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growu{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.g,.gu,.f{animation:none}}
</style><rect width='1200' height='630' rx='14' fill='#0d1117'/><text x='48' y='92' font-size='44' fill='#e6edf3' text-anchor='start' font-weight='700'>Why frontier models need</text><text x='48' y='146' font-size='44' fill='#22D3EE' text-anchor='start' font-weight='700'>a ~30B MoE sibling</text><text x='48' y='196' font-size='18' fill='#8b949e' text-anchor='start' font-weight='400'>Share of Steam PCs that can run each size (4-bit, Sep 2026)</text><rect x='110' y='260' width='150' height='300' rx='8' fill='#30363d' opacity='.35'/><rect class='gu' style='animation-delay:0.20s' x='110' y='556.2' width='150' height='3.8' rx='8' fill='#22D3EE'/><text x='185' y='544.175' font-size='30' fill='#e6edf3' text-anchor='middle' font-weight='700' class='f'>1%</text><text x='185' y='594' font-size='20' fill='#e6edf3' text-anchor='middle' font-weight='600'>~120B</text><rect x='370' y='260' width='150' height='300' rx='8' fill='#30363d' opacity='.35'/><rect class='gu' style='animation-delay:0.45s' x='370' y='464.4' width='150' height='95.6' rx='8' fill='#22D3EE'/><text x='445' y='452.375' font-size='30' fill='#e6edf3' text-anchor='middle' font-weight='700' class='f'>26%</text><text x='445' y='594' font-size='20' fill='#e6edf3' text-anchor='middle' font-weight='600'>~60B</text><rect x='630' y='260' width='150' height='300' rx='8' fill='#30363d' opacity='.35'/><rect class='gu' style='animation-delay:0.70s' x='630' y='357.9' width='150' height='202.1' rx='8' fill='#3FB950'/><text x='705' y='345.875' font-size='30' fill='#e6edf3' text-anchor='middle' font-weight='700' class='f'>54%</text><text x='705' y='594' font-size='20' fill='#e6edf3' text-anchor='middle' font-weight='600'>~35B MoE</text><rect x='890' y='260' width='150' height='300' rx='8' fill='#30363d' opacity='.35'/><rect class='gu' style='animation-delay:0.95s' x='890' y='280.0' width='150' height='280.0' rx='8' fill='#22D3EE'/><text x='965' y='268.025' font-size='30' fill='#e6edf3' text-anchor='middle' font-weight='700' class='f'>75%</text><text x='965' y='594' font-size='20' fill='#e6edf3' text-anchor='middle' font-weight='600'>~20B</text><text x='1152' y='604' font-size='18' fill='#8b949e' text-anchor='end' font-weight='400'>llms.surf</text></svg>