<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 430' width='900' height='430' role='img' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif'><title>Who can run each model size</title><style>
.g{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}
.gu{transform-box:fill-box;transform-origin:center bottom;animation:growu 1.4s cubic-bezier(.2,.8,.2,1) both}
.f{animation:fade .8s ease both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growu{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.g,.gu,.f{animation:none}}
</style><rect width='900' height='430' rx='14' fill='#0d1117'/><text x='32' y='46' font-size='24' fill='#e6edf3' text-anchor='start' font-weight='700'>Who can run each model size</text><text x='32' y='74' font-size='15' fill='#8b949e' text-anchor='start' font-weight='400'>Share of Steam users, September 2026, 4-bit weights</text><rect x='560' y='92' width='14' height='14' rx='3' fill='#3FB950'/><text x='582' y='104' font-size='14' fill='#e6edf3' text-anchor='start' font-weight='400'>Entirely on the GPU</text><rect x='560' y='114' width='14' height='14' rx='3' fill='#22D3EE'/><text x='582' y='126' font-size='14' fill='#e6edf3' text-anchor='start' font-weight='400'>GPU + experts in RAM (MoE)</text><rect class='gu' style='animation-delay:0.15s' x='90' y='368.0' width='60' height='2.0' rx='5' fill='#3FB950'/><text x='120' y='360' font-size='14' fill='#e6edf3' text-anchor='middle' font-weight='600' class='f'>0%</text><rect class='gu' style='animation-delay:0.25s' x='160' y='367.1' width='60' height='2.9' rx='5' fill='#22D3EE'/><text x='190' y='359.0675' font-size='14' fill='#e6edf3' text-anchor='middle' font-weight='600' class='f'>1%</text><text x='155' y='396' font-size='17' fill='#e6edf3' text-anchor='middle' font-weight='600'>~120B</text><rect class='gu' style='animation-delay:0.35s' x='290' y='368.0' width='60' height='2.0' rx='5' fill='#3FB950'/><text x='320' y='360' font-size='14' fill='#e6edf3' text-anchor='middle' font-weight='600' class='f'>0.5%</text><rect class='gu' style='animation-delay:0.45s' x='360' y='296.7' width='60' height='73.3' rx='5' fill='#22D3EE'/><text x='390' y='288.6875' font-size='14' fill='#e6edf3' text-anchor='middle' font-weight='600' class='f'>25.5%</text><text x='355' y='396' font-size='17' fill='#e6edf3' text-anchor='middle' font-weight='600'>~60B</text><rect class='gu' style='animation-delay:0.55s' x='490' y='348.7' width='60' height='21.3' rx='5' fill='#3FB950'/><text x='520' y='340.69625' font-size='14' fill='#e6edf3' text-anchor='middle' font-weight='600' class='f'>7.4%</text><rect class='gu' style='animation-delay:0.65s' x='560' y='215.0' width='60' height='155.0' rx='5' fill='#22D3EE'/><text x='590' y='207.0375' font-size='14' fill='#e6edf3' text-anchor='middle' font-weight='600' class='f'>53.9%</text><text x='555' y='396' font-size='17' fill='#e6edf3' text-anchor='middle' font-weight='600'>~35B</text><rect class='gu' style='animation-delay:0.75s' x='690' y='263.5' width='60' height='106.5' rx='5' fill='#3FB950'/><text x='720' y='255.48125' font-size='14' fill='#e6edf3' text-anchor='middle' font-weight='600' class='f'>37%</text><rect class='gu' style='animation-delay:0.85s' x='760' y='155.4' width='60' height='214.6' rx='5' fill='#22D3EE'/><text x='790' y='147.35250000000002' font-size='14' fill='#e6edf3' text-anchor='middle' font-weight='600' class='f'>74.7%</text><text x='755' y='396' font-size='17' fill='#e6edf3' text-anchor='middle' font-weight='600'>~20B</text><line x1='60' y1='370' x2='870' y2='370' stroke='#30363d'/><text x='32' y='416' font-size='12' fill='#8b949e' text-anchor='start' font-weight='400'>Source: Steam Hardware Survey; calculation at llms.surf/blog/…/medicoes</text></svg>