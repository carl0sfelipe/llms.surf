[package]
name = "dispatch-policy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "llms.surf kernel P1: pure dispatch policy (tier -> ordered fallback chain) with laws"

[[bin]]
name = "dispatch-policy"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
