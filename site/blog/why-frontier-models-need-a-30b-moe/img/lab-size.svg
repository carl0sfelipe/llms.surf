<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 464' width='900' height='464' role='img' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif'><title>Downloads from models above 70B</title><style>
.g{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}
