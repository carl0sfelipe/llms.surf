<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 300' width='900' height='300' role='img' font-family='Inter,Segoe UI,Helvetica,Arial,sans-serif'><title>Feedback receipts</title><style>
.g{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}
.gu{transform-box:fill-box;transform-origin:center bottom;animation:growu 1.4s cubic-bezier(.2,.8,.2,1) both}
.f{animation:fade .8s ease both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growu{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.g,.gu,.f{animation:none}}
</style><rect width='900' height='300' rx='14' fill='#0d1117'/><defs><marker id='a' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0 0L10 5L0 10z' fill='#8b949e'/></marker></defs><text x='32' y='46' font-size='24' fill='#e6edf3' text-anchor='start' font-weight='700'>Feedback receipts</text><text x='32' y='74' font-size='15' fill='#8b949e' text-anchor='start' font-weight='400'>Private context stays home; only a typed record and its proof travel</text><g class='f' style='animation-delay:0.00s'><rect x='32' y='110' width='150' height='120' rx='10' fill='none' stroke='#3FB950' stroke-width='2'/><text x='107' y='145' font-size='17' fill='#3FB950' text-anchor='middle' font-weight='700'>Your machine</text><text x='107' y='178' font-size='14' fill='#e6edf3' text-anchor='middle' font-weight='400'>technical record</text><text x='107' y='200' font-size='14' fill='#e6edf3' text-anchor='middle' font-weight='400'>+ salted hash</text></g><path class='f' style='animation-delay:0.20s' d='M184 170 L202 170' stroke='#8b949e' stroke-width='2' marker-end='url(#a)'/><g class='f' style='animation-delay:0.35s'><rect x='204' y='110' width='150' height='120' rx='10' fill='none' stroke='#22D3EE' stroke-width='2'/><text x='279' y='145' font-size='17' fill='#22D3EE' text-anchor='middle' font-weight='700'>Sign</text><text x='279' y='178' font-size='14' fill='#e6edf3' text-anchor='middle' font-weight='400'>install key,</text><text x='279' y='200' font-size='14' fill='#e6edf3' text-anchor='middle' font-weight='400'>not a name</text></g><path class='f' style='animation-delay:0.55s' d='M356 170 L374 170' stroke='#8b949e' stroke-width='2' marker-end='url(#a)'/><g class='f' style='animation-delay:0.70s'><rect x='376' y='110' width='150' height='120' rx='10' fill='none' stroke='#22D3EE' stroke-width='2'/><text x='451' y='145' font-size='17' fill='#22D3EE' text-anchor='middle' font-weight='700'>Merkle tree</text><text x='451' y='178' font-size='14' fill='#e6edf3' text-anchor='middle' font-weight='400'>thousands of</text><text x='451' y='200' font-size='14' fill='#e6edf3' text-anchor='middle' font-weight='400'>records → 1 root</text></g><path class='f' style='animation-delay:0.90s' d='M528 170 L546 170' stroke='#8b949e' stroke-width='2' marker-end='url(#a)'/><g class='f' style='animation-delay:1.05s'><rect x='548' y='110' width='150' height='120' rx='10' fill='none' stroke='#f0883e' stroke-width='2'/><text x='623' y='145' font-size='17' fill='#f0883e' text-anchor='middle' font-weight='700'>Bitcoin</text><text x='623' y='178' font-size='14' fill='#e6edf3' text-anchor='middle' font-weight='400'>48-byte root</text><text x='623' y='200' font-size='14' fill='#e6edf3' text-anchor='middle' font-weight='400'>in OP_RETURN</text></g><path class='f' style='animation-delay:1.25s' d='M700 170 L718 170' stroke='#8b949e' stroke-width='2' marker-end='url(#a)'/><g class='f' style='animation-delay:1.40s'><rect x='720' y='110' width='150' height='120' rx='10' fill='none' stroke='#3FB950' stroke-width='2'/><text x='795' y='145' font-size='17' fill='#3FB950' text-anchor='middle' font-weight='700'>Receipt</text><text x='795' y='178' font-size='14' fill='#e6edf3' text-anchor='middle' font-weight='400'>anyone can</text><text x='795' y='200' font-size='14' fill='#e6edf3' text-anchor='middle' font-weight='400'>verify</text></g><text x='32' y='276' font-size='14' fill='#8b949e' text-anchor='start' font-weight='400'>Prompts, paths, code and logs never leave the machine.</text></svg>